# Free Hugging Face Spaces sleep after 48 h without traffic, which also stops
# the ingest scheduler. Set the repo variable SPACE_URL to the Space's
# https://<user>-<space>.hf.space address.
name: Keep HF Space awake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - run: curl -fsS --retry 5 --retry-delay 30 --max-time 300 "${{ vars.SPACE_URL }}/events/ingest/status"
