<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prototype: Map layer controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <style>
    /* PROTOTYPE ONLY: three layer-panel variants, switchable via ?variant=a|b|c. */
    :root {
      --bg: #0d1115; --panel: #141a20; --raised: #1b232c; --line: #293440;
      --line-strong: #3a4755; --text: #f4f6f8; --muted: #aeb8c3;
      --accent: #d7b71f; --accent-ink: #11140a; --accent-dim: rgba(215,183,31,.12);
      --danger: #d8393d; --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Archivo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button, label, input[type="range"] { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .prototype-head {
      position: fixed; inset: 0 0 auto 0; height: 62px; z-index: 4;
      display: flex; align-items: center; gap: 18px; padding: 0 24px;
      border-bottom: 1px solid var(--line); background: rgba(13,17,21,.94);
      backdrop-filter: blur(12px);
    }
    .prototype-head strong { font-size: 15px; font-variation-settings: "wdth" 82, "wght" 800; }
    .prototype-head span { color: var(--muted); font: 11px var(--mono); letter-spacing: .04em; }
    .prototype-head .tag {
      margin-left: auto; padding: 5px 7px; border: 1px solid var(--line-strong);
      color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em;
    }
    .stage {
      min-height: 100dvh; display: grid; place-items: start center;
      padding: 90px 20px 110px;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .panel {
      width: min(420px, 100%); min-height: 780px; background: var(--panel);
      border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }
    .panel-top { padding: 20px 20px 15px; border-bottom: 1px solid var(--line); }
    .panel-top h1 { margin: 0; font: 500 13px var(--mono); letter-spacing: .17em; text-transform: uppercase; }
    .panel-top p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .section { padding: 15px 20px; border-bottom: 1px solid var(--line); }
    .section-title {
      margin: 0 0 9px; color: var(--muted); font: 500 11px var(--mono);
      letter-spacing: .1em; text-transform: uppercase;
    }
    .note { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .row { min-height: 29px; display: flex; align-items: center; gap: 8px; }
    .row:hover { background: var(--accent-dim); }
    .row.flush { margin: 0 -7px; padding: 0 7px; }
    .name { min-width: 0; font-size: 14px; font-weight: 600; }
    .swatch { width: 14px; height: 14px; flex: none; border: 1px solid rgba(255,255,255,.12); }
    .grow { flex: 1; }
    .value { color: var(--text); font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
    .count { color: var(--accent); font: 11px var(--mono); }
    .check, .radio {
      appearance: none; display: grid; place-content: center; flex: none;
      width: 16px; height: 16px; margin: 0; border: 1px solid #71808f; background: transparent;
    }
    .check::before {
      content: ""; width: 4px; height: 8px; margin-top: -2px;
      border: solid var(--accent-ink); border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
    }
    .check:checked { border-color: var(--accent); background: var(--accent); }
    .check:checked::before { transform: rotate(45deg) scale(1); }
    .radio { border-radius: 50%; }
    .radio::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: scale(0); }
    .radio:checked { border-color: var(--accent); }
    .radio:checked::before { transform: scale(1); }
    .range { appearance: none; width: 76px; height: 18px; margin: 0; background: transparent; }
    .range::-webkit-slider-runnable-track { height: 4px; background: var(--line-strong); border-radius: 2px; }
    .range::-webkit-slider-thumb {
      appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
      border: 2px solid var(--panel); background: var(--accent); box-shadow: 0 0 0 1px var(--accent);
    }
    .number {
      width: 54px; height: 28px; border: 1px solid var(--line); background: #10151a;
      color: var(--text); text-align: center; font: 500 13px var(--mono);
    }
    .switch { position: relative; width: 34px; height: 18px; flex: none; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch i { position: absolute; inset: 0; border: 1px solid #526170; background: #202933; transition: 150ms ease; }
    .switch i::before { content: ""; position: absolute; width: 12px; height: 12px; left: 2px; top: 2px; background: #9ba6b1; transition: 150ms ease; }
    .switch input:checked + i { border-color: var(--accent); background: var(--accent); }
    .switch input:checked + i::before { transform: translateX(16px); background: var(--accent-ink); }
    .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
    .swatches { margin: 2px 0 6px 24px; display: grid; gap: 3px; }
    .swatches span { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .swatches i { width: 13px; height: 11px; }

    /* A: familiar precision list */
    .variant-a .overlay-row .row-controls { display: none; margin-left: auto; align-items: center; gap: 7px; }
    .variant-a .overlay-row:has(.check:checked) .row-controls { display: flex; }
    .variant-a .overlay-list { display: grid; gap: 1px; }
    .variant-a .basemap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px; }
    .variant-a .basemap-grid .row { min-width: 0; }
    .variant-a .basemap-grid .name { font-size: 13px; white-space: nowrap; }
    .variant-a .utility { display: grid; gap: 14px; }
    .variant-a .utility-block { display: grid; gap: 5px; }

    /* B: progressive disclosure */
    .variant-b .panel-top { background: linear-gradient(180deg, var(--accent-dim), transparent); }
    .summary-line { display: flex; align-items: baseline; gap: 9px; margin-top: 12px; }
    .summary-line b { font-size: 34px; line-height: 1; font-variation-settings: "wdth" 78, "wght" 850; }
    .summary-line span { color: var(--muted); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .quake-toggle { padding: 13px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 11px; }
    .quake-toggle strong { display: block; font-size: 14px; }
    .quake-toggle small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .accordion { border-bottom: 1px solid var(--line); }
    .accordion-head {
      width: 100%; height: 48px; padding: 0 20px; border: 0; background: transparent;
      display: flex; align-items: center; gap: 9px; text-align: left;
    }
    .accordion-head:hover { background: var(--accent-dim); }
    .accordion-head b { font-size: 14px; }
    .accordion-head span { margin-left: auto; color: var(--muted); font: 11px var(--mono); }
    .accordion-head::after { content: "+"; color: var(--muted); font: 16px var(--mono); }
    .accordion.open .accordion-head::after { content: "-"; }
    .accordion-body { display: none; padding: 0 20px 14px; }
    .accordion.open .accordion-body { display: block; }
    .layer-unit { margin: 0 -7px; padding: 7px; border-top: 1px solid rgba(41,52,64,.7); }
    .layer-unit:first-child { border-top: 0; }
    .layer-unit .row { min-height: 25px; }
    .layer-unit .detail { display: none; align-items: center; gap: 9px; padding: 8px 0 2px 42px; }
    .layer-unit:has(.switch input:checked) .detail { display: flex; }
    .selected-basemap { padding: 11px 12px; border: 1px solid var(--line); background: #10151a; }
    .selected-basemap b { display: block; font-size: 14px; }
    .selected-basemap span { display: block; margin-top: 3px; color: var(--muted); font: 10px var(--mono); }

    /* C: active stack first */
    .variant-c .panel-top { padding-bottom: 0; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-top: 15px; }
    .tab { height: 34px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .tab.active { color: var(--text); border-color: var(--accent); }
    .stack { display: grid; gap: 7px; }
    .stack-card { display: grid; grid-template-columns: 8px 14px 1fr auto; gap: 9px; align-items: center; min-height: 48px; padding: 8px 10px; border: 1px solid var(--line); background: #10151a; }
    .grip { color: #617080; font: 12px/1 var(--mono); letter-spacing: -3px; overflow: hidden; }
    .stack-copy b { display: block; font-size: 13px; }
    .stack-copy small { display: block; margin-top: 2px; color: var(--muted); font: 10px var(--mono); }
    .icon-btn { width: 26px; height: 26px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
    .icon-btn:hover { border-color: var(--danger); color: #f07b7e; }
    .catalog-title { display: flex; align-items: center; margin-bottom: 10px; }
    .catalog-title .section-title { margin: 0; }
    .catalog-title span { margin-left: auto; color: var(--muted); font: 10px var(--mono); }
    .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .catalog button { min-height: 51px; padding: 8px 9px; border: 1px solid var(--line); background: transparent; text-align: left; }
    .catalog button:hover { border-color: var(--accent); background: var(--accent-dim); }
    .catalog button b { display: block; font-size: 12px; }
    .catalog button span { display: block; margin-top: 3px; color: var(--muted); font: 9px var(--mono); text-transform: uppercase; letter-spacing: .07em; }
    .basebar { display: flex; align-items: center; gap: 10px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
    .basebar span { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; }
    .basebar select { margin-left: auto; min-width: 185px; height: 32px; padding: 0 8px; border: 1px solid var(--line); background: #10151a; color: var(--text); font-size: 12px; }
    .stack-summary { padding: 11px 20px; color: var(--muted); font-size: 12px; line-height: 1.4; }

    .switcher {
      position: fixed; z-index: 10; left: 50%; bottom: 22px; transform: translateX(-50%);
      display: grid; grid-template-columns: 42px minmax(190px, auto) 42px; align-items: center;
      border: 1px solid #536170; background: #eef1f3; color: #11161b;
      box-shadow: 0 12px 35px rgba(0,0,0,.45);
    }
    .switcher button { height: 42px; border: 0; background: transparent; font: 18px var(--mono); }
    .switcher button:hover { background: #d9dfe3; }
    .switcher-output { padding: 0 12px; text-align: center; font: 600 11px var(--mono); letter-spacing: .02em; white-space: nowrap; }
    @media (max-width: 560px) {
      .prototype-head { padding: 0 14px; }
      .prototype-head span { display: none; }
      .stage { padding: 72px 0 96px; display: block; }
      .panel { width: 100%; min-height: calc(100dvh - 72px); border-left: 0; border-right: 0; }
      .variant-a .basemap-grid { grid-template-columns: 1fr; }
      .switcher { bottom: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header class="prototype-head">
    <strong>Map layer controls</strong>
    <span>Three structural directions for the Layers panel</span>
    <span class="tag">Prototype only</span>
  </header>
  <main class="stage"><div id="app"></div></main>
  <nav class="switcher" aria-label="Prototype variants">
    <button id="previous" type="button" aria-label="Previous variant">←</button>
    <output id="variant-label" class="switcher-output"></output>
    <button id="next" type="button" aria-label="Next variant">→</button>
  </nav>
  <script>
    const overlays = [
      ["National", "#777d82", true, "1.5"], ["Provinces", "#9ba0a4", true, "1"],
      ["Districts", "#aeb2b5", false, "1"], ["Tehsils", "#747a7f", false, "1"],
      ["Global Faults", "#cb3037", false, "1"], ["Plate boundaries", "#ddb82b", false, "1"],
      ["National Faults", "#d8393d", true, "1.1"], ["Major Faults", "#a77a1c", false, "1"],
      ["PGA Zones", "#181b1d", false, "1"], ["Tectonic Zones", "#9c6044", false, "1"]
    ];
    const basemaps = ["OpenStreetMap", "Humanitarian (HOT)", "Topographic", "Light (Positron)", "Voyager", "Dark (Dark Matter)", "CyclOSM", "Transport (OPNVKarte)", "Satellite (Esri)"];
    const zones = [["Zone 1", "#3b681b"], ["Zone 2A", "#174e2a"], ["Zone 2B", "#e4dc62"], ["Zone 3", "#efa65b"], ["Zone 4", "#a64f49"]];
    const variants = {
      a: { label: "A / Precision list", render: renderA },
      b: { label: "B / Progressive groups", render: renderB },
      c: { label: "C / Active stack", render: renderC }
    };
    const keys = Object.keys(variants);
    const swatch = color => `<i class="swatch" style="background:${color}" aria-hidden="true"></i>`;
    const check = (checked, label) => `<input class="check" type="checkbox" ${checked ? "checked" : ""} aria-label="${label}" />`;
    const range = (value, label) => `<input class="range" type="range" min="0" max="100" value="${value}" aria-label="${label}" />`;

    function renderA() {
      const overlayRows = overlays.map(([name, color, on, width]) => `
        <div class="overlay-row">
          <div class="row flush">${check(on, name)}${swatch(color)}<span class="name">${name}</span>
            <span class="row-controls"><input class="number" type="text" value="${width}" aria-label="${name} width" />${range(78, `${name} opacity`)}</span>
          </div>
          ${name === "PGA Zones" ? `<div class="swatches">${zones.map(([z,c]) => `<span>${swatch(c)}${z}</span>`).join("")}</div>` : ""}
        </div>`).join("");
      const baseRows = basemaps.map(name => `<label class="row flush"><input class="radio" type="radio" name="base-a" ${name === "Dark (Dark Matter)" ? "checked" : ""} /><span class="name">${name}</span></label>`).join("");
      return `<article class="panel variant-a">
        <header class="panel-top"><h1>Map configuration</h1><p>Direct access to every map layer and its rendering controls.</p></header>
        <section class="section"><h2 class="section-title">Current earthquake</h2>
          <label class="row flush">${check(true, "Show MMI polygons")}<span class="name">Show MMI polygons</span></label>
          <p class="note">Epicenter stays visible when the shaking footprint is hidden.</p>
        </section>
        <section class="section"><h2 class="section-title">Overlays <span class="count">3 active</span></h2><div class="overlay-list">${overlayRows}</div></section>
        <section class="section"><h2 class="section-title">Basemap</h2><div class="basemap-grid">${baseRows}</div></section>
        <section class="section utility"><div class="utility-block"><h2 class="section-title">MMI intensity</h2><div class="row"><span class="name">Polygon opacity</span><span class="grow"></span>${range(50,"MMI polygon opacity")}<span class="value">50%</span></div></div>
          <div class="utility-block"><h2 class="section-title">Seismic hazard</h2><label class="row">${check(false,"PGA return period")}<span class="name">PGA return period</span></label></div>
          <div class="utility-block"><h2 class="section-title">Landslide susceptibility</h2><label class="row">${check(false,"Very High areas")}${swatch("#d8393d")}<span class="name">Very High areas</span></label></div>
        </section>
      </article>`;
    }

    function renderB() {
      const primary = overlays.slice(0, 8).map(([name,color,on]) => `<div class="layer-unit"><div class="row">
        <label class="switch"><input type="checkbox" ${on ? "checked" : ""} aria-label="${name}" /><i></i></label>${swatch(color)}<span class="name">${name}</span></div>
        <div class="detail"><span class="section-title">Opacity</span>${range(76,`${name} opacity`)}<span class="value">76%</span></div></div>`).join("");
      return `<article class="panel variant-b">
        <header class="panel-top"><h1>Map configuration</h1><div class="summary-line"><b>4</b><span>visible layers</span></div><p>Open only the group you need. Active settings remain one step away.</p></header>
        <label class="quake-toggle"><span class="switch"><input type="checkbox" checked aria-label="Show MMI polygons" /><i></i></span><span class="grow"><strong>Earthquake footprint</strong><small>MMI polygons and epicenter</small></span><span class="value">ON</span></label>
        <section class="accordion open"><button class="accordion-head" type="button"><b>Reference overlays</b><span>3 active</span></button><div class="accordion-body">${primary}</div></section>
        <section class="accordion"><button class="accordion-head" type="button"><b>Hazard layers</b><span>2 available</span></button><div class="accordion-body">
          <div class="layer-unit"><div class="row"><label class="switch"><input type="checkbox" aria-label="PGA return period" /><i></i></label><span class="name">PGA return period</span></div></div>
          <div class="layer-unit"><div class="row"><label class="switch"><input type="checkbox" aria-label="Very High areas" /><i></i></label>${swatch("#d8393d")}<span class="name">Very High areas</span></div></div>
        </div></section>
        <section class="accordion open"><button class="accordion-head" type="button"><b>Basemap</b><span>Dark</span></button><div class="accordion-body"><div class="selected-basemap"><b>Dark Matter</b><span>Low-light operational basemap</span></div>
          ${basemaps.slice(0,5).map(name => `<label class="row flush"><input class="radio" type="radio" name="base-b" /><span class="name">${name}</span></label>`).join("")}
        </div></section>
        <section class="accordion"><button class="accordion-head" type="button"><b>Display settings</b><span>50%</span></button><div class="accordion-body"><div class="row"><span class="name">MMI opacity</span><span class="grow"></span>${range(50,"MMI opacity")}<span class="value">50%</span></div></div></section>
      </article>`;
    }

    function renderC() {
      const active = overlays.filter(item => item[2]).map(([name,color,,width], index) => `<div class="stack-card"><span class="grip">::</span>${swatch(color)}<span class="stack-copy"><b>${name}</b><small>${index === 2 ? `FAULTS / ${width} PX` : `BOUNDARY / ${width} PX`}</small></span><button class="icon-btn" type="button" aria-label="Remove ${name}">×</button></div>`).join("");
      const available = overlays.filter(item => !item[2]).slice(0,6).map(([name,,]) => `<button type="button"><b>${name}</b><span>Add to map</span></button>`).join("");
      return `<article class="panel variant-c">
        <header class="panel-top"><h1>Map stack</h1><p>Manage visible layers in draw order, then add from the catalog.</p><div class="tabs"><button class="tab active" type="button">Stack</button><button class="tab" type="button">Catalog</button></div></header>
        <label class="quake-toggle"><span class="switch"><input type="checkbox" checked aria-label="Show earthquake footprint" /><i></i></span><span class="grow"><strong>Earthquake footprint</strong><small>Always drawn above reference layers</small></span><span class="value">50%</span></label>
        <section class="section"><div class="catalog-title"><h2 class="section-title">Visible now</h2><span>Top draws first</span></div><div class="stack">${active}</div></section>
        <div class="basebar"><span>Basemap</span><select aria-label="Basemap">${basemaps.map(name => `<option ${name === "Dark (Dark Matter)" ? "selected" : ""}>${name}</option>`).join("")}</select></div>
        <section class="section"><div class="catalog-title"><h2 class="section-title">Available layers</h2><span>7 hidden</span></div><div class="catalog">${available}</div></section>
        <div class="stack-summary">MMI opacity is controlled from the earthquake footprint row. Hazard layers join the same visible stack when enabled.</div>
      </article>`;
    }

    function currentKey() {
      const key = new URLSearchParams(location.search).get("variant")?.toLowerCase();
      return variants[key] ? key : "a";
    }
    function render() {
      const key = currentKey();
      document.getElementById("app").innerHTML = variants[key].render();
      document.getElementById("variant-label").textContent = variants[key].label;
      document.querySelectorAll(".accordion-head").forEach(button => button.addEventListener("click", () => button.parentElement.classList.toggle("open")));
      document.querySelectorAll(".range").forEach(input => input.addEventListener("input", () => {
        const value = input.parentElement.querySelector(".value");
        if (value) value.textContent = `${input.value}%`;
      }));
    }
    function cycle(direction) {
      const index = keys.indexOf(currentKey());
      const next = keys[(index + direction + keys.length) % keys.length];
      const url = new URL(location.href); url.searchParams.set("variant", next);
      history.replaceState({}, "", url); render();
    }
    document.getElementById("previous").addEventListener("click", () => cycle(-1));
    document.getElementById("next").addEventListener("click", () => cycle(1));
    document.addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
